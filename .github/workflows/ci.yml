name: CI

# One workflow for two hosts: GitHub (main repository, full matrix) and the Gitea mirror at
# git.ywfl.dev (runners kindly provided by @yawaflua: Linux x64 only). Steps branch on github.server_url.

on:
  push:
    # Feature branches are checked by pull_request; avoid a second full matrix on every push.
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_signing:
        description: Rehearse unsigned packaging without creating a release
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # CI never starts real network engines.
  BYDLO_SAFE_DEV: "1"
  BYDLO_MOCK: "1"

jobs:
  signing-policy:
    name: Select release signing policy
    runs-on: ubuntu-latest
    outputs:
      unsigned: ${{ steps.policy.outputs.unsigned }}
    steps:
      - id: policy
        env:
          # Explicit release exceptions; future tags still require signing.
          UNSIGNED: ${{ github.ref == 'refs/tags/v0.3.1' || github.ref == 'refs/tags/v0.4.0' || github.ref == 'refs/tags/v0.4.1' || github.ref == 'refs/tags/v0.4.2' || (github.event_name == 'workflow_dispatch' && inputs.skip_signing) }}
        run: |
          echo "unsigned=$UNSIGNED" >> "$GITHUB_OUTPUT"
          echo "Unsigned packaging: $UNSIGNED" >> "$GITHUB_STEP_SUMMARY"

  unix-activation:
    name: Verify macOS single-instance activation
    if: github.server_url == 'https://github.com'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test isolated suite including owner-only local IPC (no engines or network)
        run: |
          source scripts/env.sh
          dotnet test tests/Bydlo.Tests/Bydlo.Tests.csproj -c Release

  amnezia-macos:
    name: Cross-build AmneziaWG for macOS ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compile and hash macOS host (never execute engine)
        run: |
          source scripts/env.sh
          export GOPATH="$PWD/.tmp/go-path" GOCACHE="$PWD/.tmp/go-cache"
          export GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=darwin GOARCH=arm64
          mkdir -p artifacts/amnezia-macos
          go -C tools/amneziawg mod download
          go -C tools/amneziawg mod verify
          go -C tools/amneziawg build -mod=readonly -trimpath -buildvcs=false -ldflags=-s -o "$PWD/artifacts/amnezia-macos/bydlo-amneziawg" .
          cd artifacts/amnezia-macos
          test "$(od -An -tx1 -N8 bydlo-amneziawg | tr -d ' \n')" = cffaedfe0c000001
          sha256sum bydlo-amneziawg > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.server_url == 'https://github.com'
        with:
          name: amnezia-macos-arm64
          retention-days: 7
          path: artifacts/amnezia-macos/

  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.server_url == 'https://github.com' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Hook self-test
        shell: bash
        run: bash scripts/test-hooks.sh
      - name: Native cache self-test (dummy files only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-native-build-cache.ps1
      - name: Application license self-test (synthetic files, no network)
        if: github.server_url == 'https://github.com'
        shell: pwsh
        run: ./scripts/test-app-licenses.ps1
      - name: Bundle verification self-test (synthetic files, never execute engines)
        if: github.server_url == 'https://github.com'
        shell: pwsh
        run: ./scripts/test-engine-bundle.ps1
      - name: Windows cross-build self-test (synthetic PE/MSI trees, no engines)
        if: github.server_url == 'https://github.com'
        shell: pwsh
        run: ./scripts/test-windows-cross-build.ps1
      - name: Release staging and gate regressions (synthetic files only)
        shell: pwsh
        run: |
          ./scripts/test-release-staging.ps1
          ./scripts/test-release-gate.ps1
      - name: Arch binary package regression (synthetic .deb, never install)
        if: runner.os == 'Linux' && github.server_url == 'https://github.com'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libarchive-tools
          bash scripts/test-arch-package.sh
      - name: Build
        run: |
          source scripts/env.sh
          dotnet build BYDLO.slnx -c Release -warnaserror
      - name: Audit NuGet dependencies (including transitive packages)
        run: |
          source scripts/env.sh
          dotnet list BYDLO.slnx package --vulnerable --include-transitive
          # The list command reports advisories but does not fail on vulnerable packages.
          # Force a fresh audit and fail on advisories or unavailable vulnerability data.
          dotnet restore BYDLO.slnx --force-evaluate -warnaserror \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
      - name: Test
        run: |
          source scripts/env.sh
          # Coverage is collected as a CI artifact only, with no threshold gate yet (issue #221).
          dotnet test tests/Bydlo.Tests/Bydlo.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Update catalog interop (release script signs, Bydlo.Core verifies; throwaway key)
        shell: pwsh
        run: ./scripts/test-update-catalog-interop.ps1
      - name: Verify server groups (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/server-groups-verification ru --mock --verify-server-groups
      - name: Verify import flows (headless, no engines or network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/import-verification en --mock --verify-import
      - name: Verify activation failure window (headless, no services or engines)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/startup-error-en en --mock --verify-startup-error
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/startup-error-ru ru --mock --verify-startup-error
      - name: Verify add-server wizard (headless, mock only, fake HTTP)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/wizard-verification ru --mock --verify-wizard
      - name: Verify disclosure hit areas (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/disclosure-verification ru --mock --verify-disclosure
      - name: Verify simple home and settings (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/simple-ui-verification ru --mock --verify-simple-ui
      - name: Verify license notices and credits (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/license-verification ru --mock --verify-licenses
      - name: Verify contributors page (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/contributors-verification ru --mock --verify-contributors
      - name: Verify settings section navigation (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/settings-navigation-verification ru --mock --verify-settings-navigation
      - name: Verify automatic update settings (mock only)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/auto-update-ui ru --mock --verify-auto-updates
      - name: Verify Zapret selection UI (headless, no engines or network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/selection-verification en --mock --verify-zapret-selection
      - name: Verify desktop integration (headless, mock only, no OS registration)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/desktop-verification en --mock --verify-desktop
      - name: Verify bundled engine UI (headless, mock only, no driver setup)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/bundle-verification en --mock --verify-bundled-engines
      - name: Verify custom themes (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/theme-verification en --mock --verify-themes
      - name: Verify Windows application picker (headless, mock only, no engines)
        if: runner.os == 'Windows'
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/routing-verification ru --mock --verify-routing-picker
      - name: Verify active connections (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/connections-verification ru --mock --verify-active-connections
      - name: Verify routing rules and sources (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/routing-rules-verification ru --mock --verify-routing-rules
      - name: Verify backup restore (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/backup-verification ru --mock --verify-backup
      - name: Verify profile menu and sharing (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/share-verification ru --mock --verify-share
      - name: Verify connection switching (headless, mock only, no network)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/connect-switch-verification ru --mock --verify-connect-switch
      # Artifacts are kept on GitHub only: artifact actions v4 refuse to run on Gitea (it looks like GHES),
      # and GitHub fails the whole job if a step even references the deprecated v3.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.server_url == 'https://github.com'
        with:
          name: test-results-${{ matrix.os }}
          retention-days: 7
          path: TestResults

  # The flake must keep building: nix/deps.json pins every NuGet package and goes stale when
  # Directory.Packages.props changes (refresh with scripts/update-nix-deps.sh). Builds only, never runs the app.
  nix:
    name: Nix flake (x86_64-linux)
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Evaluate and build the flake
        run: |
          nix flake check --no-build
          nix build .#bydlo -L

  # Native AOT cannot cross-compile between operating systems, so the privileged helper is built on each target OS.
  # Linux uses the official .NET cross-build images: their Ubuntu 18.04 sysroot keeps the glibc baseline of the
  # .NET runtime itself, so the helper runs everywhere the app does. The helper is never executed here.
  helper:
    name: Native AOT helper ${{ matrix.rid }}
    if: github.server_url == 'https://github.com'
    needs: test
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04, container: 'mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64', sysroot: /crossrootfs/x64 }
          - { rid: linux-arm64, os: ubuntu-24.04, container: 'mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64', sysroot: /crossrootfs/arm64 }
          - { rid: osx-arm64, os: macos-15 }
    env:
      # The cross images ship without ICU; the build does not need culture data.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${{ matrix.container && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish Native AOT helper (never executed)
        shell: bash
        run: |
          source scripts/env.sh
          # The ILCompiler locates the MSVC linker through vswhere.
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$PATH:$(cygpath -F 42)/Microsoft Visual Studio/Installer"; fi
          args=()
          if [ -n "${{ matrix.sysroot }}" ]; then
            args+=(-p:SysRoot=${{ matrix.sysroot }} -p:LinkerFlavor=lld -p:ObjCopyName=llvm-objcopy)
          fi
          dotnet publish src/Bydlo.Helper/Bydlo.Helper.csproj -c Release -r ${{ matrix.rid }} \
            -p:WarningsAsErrors=CA1416 "${args[@]}" -o .tmp/helper-publish
          mkdir -p artifacts/helper
          # Ship only the executable: symbols (.pdb / .dbg / .dSYM) stay out of the release bundle.
          find .tmp/helper-publish -maxdepth 1 -type f -name 'Bydlo.Helper*' ! -name '*.pdb' ! -name '*.dbg' -exec cp {} artifacts/helper/ \;
          ls -l artifacts/helper
          # BSD wc (macOS) pads the count with spaces.
          test "$(find artifacts/helper -type f | wc -l | tr -d ' ')" = 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-${{ matrix.rid }}
          retention-days: 7
          path: artifacts/helper
          if-no-files-found: error

  desktop:
    name: Publish ${{ matrix.rid }}
    needs: [test, helper]
    # The Gitea mirror has no Windows/macOS runners: there the helper job is skipped and a trimmed helper is built below.
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.helper.result == 'success' || needs.helper.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.server_url == 'https://github.com' && '[{"rid":"win-x64","os":"ubuntu-latest"},{"rid":"win-arm64","os":"ubuntu-latest"},{"rid":"linux-x64","os":"ubuntu-24.04"},{"rid":"linux-arm64","os":"ubuntu-24.04-arm"},{"rid":"osx-arm64","os":"ubuntu-24.04","managedOnly":true}]' || '[{"rid":"linux-x64","os":"ubuntu-latest"},{"rid":"win-x64","os":"ubuntu-latest"},{"rid":"win-arm64","os":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish
        shell: bash
        run: |
          source scripts/env.sh
          # Trimming and ReadyToRun come from Bydlo.Desktop.csproj; both cross-compile from Linux.
          dotnet publish src/Bydlo.Desktop/Bydlo.Desktop.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:WarningsAsErrors=CA1416 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/BYDLO-${{ matrix.rid }}
      - name: Add the Native AOT helper
        if: github.server_url == 'https://github.com'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helper-${{ matrix.rid }}
          path: publish/BYDLO-${{ matrix.rid }}/helper
      - name: Publish a trimmed helper (Gitea mirror)
        if: github.server_url != 'https://github.com'
        shell: bash
        run: |
          source scripts/env.sh
          dotnet publish src/Bydlo.Helper/Bydlo.Helper.csproj -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=false --self-contained true -p:PublishTrimmed=true -p:WarningsAsErrors=CA1416 \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/BYDLO-${{ matrix.rid }}/helper
      - name: Bundle pinned sing-box, Xray and Zapret (never execute engines)
        shell: bash
        run: |
          source scripts/env.sh
          # Release downloads can return transient HTTP 5xx errors. Each attempt still
          # verifies pinned SHA-256 hashes; a persistent failure must fail the job.
          for attempt in 1 2 3; do
            if dotnet run --project tools/Bydlo.BundleEngines -c Release -- \
              ${{ matrix.rid }} publish/BYDLO-${{ matrix.rid }} .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Engine bundling failed (attempt $attempt/3); retrying."
            sleep "$((attempt * 10))"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !matrix.managedOnly }}
        with:
          go-version: '1.27.3'
          cache: false
      # Gitea runner images ship without PowerShell and some build tools that GitHub images include.
      - name: Install build tools missing on the Gitea runner
        if: ${{ !matrix.managedOnly && github.server_url != 'https://github.com' }}
        shell: bash
        run: |
          missing=
          for tool in make gcc perl autoreconf libtoolize pkg-config readelf; do
            command -v "$tool" >/dev/null || missing=1
          done
          if [ -n "$missing" ]; then
            sudo=; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends build-essential perl autoconf automake libtool pkg-config binutils
          fi
          if ! command -v pwsh >/dev/null; then
            ver=7.6.7
            sha=6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431
            curl -fsSL -o "$RUNNER_TEMP/pwsh.tar.gz" "https://github.com/PowerShell/PowerShell/releases/download/v$ver/powershell-$ver-linux-x64.tar.gz"
            echo "$sha  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/pwsh"
            tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
            chmod +x "$RUNNER_TEMP/pwsh/pwsh"
            echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
            # Without ICU, PowerShell refuses to start unless globalization is invariant.
            ldconfig -p | grep -q libicu || echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> "$GITHUB_ENV"
          fi
      - name: Install read-only MSI extractor on Linux
        if: startsWith(matrix.rid, 'win-')
        run: |
          sudo=; [ "$(id -u)" = 0 ] || sudo=sudo
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends msitools
      - name: Build and bundle AmneziaWG and OpenVPN (never execute engines)
        if: ${{ !matrix.managedOnly }}
        shell: pwsh
        run: ./scripts/build-bundled-engines.ps1 -Rid '${{ matrix.rid }}' -PublishDirectory 'publish/BYDLO-${{ matrix.rid }}'
      - name: Verify Windows cross-build fixtures on Linux
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./scripts/test-windows-cross-build.ps1
      - name: Verify offline bundle contents and architecture (never execute engines)
        shell: pwsh
        run: ./scripts/verify-engine-bundle.ps1 -Rid '${{ matrix.rid }}' -PublishDirectory 'publish/BYDLO-${{ matrix.rid }}' -PrebuiltOnly:$${{ matrix.managedOnly == true }}
      - name: Add notices
        if: ${{ !matrix.managedOnly }}
        shell: bash
        run: cp LICENSE THIRD_PARTY_NOTICES.md README.md publish/BYDLO-${{ matrix.rid }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.server_url == 'https://github.com'
        with:
          name: ${{ matrix.managedOnly && 'managed-osx-arm64' || format('BYDLO-{0}', matrix.rid) }}
          retention-days: 7
          path: publish/BYDLO-${{ matrix.rid }}

  windows-parity:
    name: Compare Windows/Linux engine bytes (${{ matrix.rid }})
    if: github.server_url == 'https://github.com'
    needs: desktop
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BYDLO-${{ matrix.rid }}
          path: artifacts/windows-cross
      - name: Bundle on Windows using pinned lessmsi (never execute engines)
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          dotnet run --project tools/Bydlo.BundleEngines -c Release -- '${{ matrix.rid }}' artifacts/windows-native .
          if ($LASTEXITCODE -ne 0) { throw 'Prebuilt engine bundling failed' }
          ./scripts/build-bundled-engines.ps1 -Rid '${{ matrix.rid }}' -PublishDirectory artifacts/windows-native
          ./scripts/compare-engine-payload.ps1 -CrossBundle artifacts/windows-cross -NativeBundle artifacts/windows-native

  sign-windows:
    name: Sign Windows binaries
    # Release signing only; PRs never touch keys. Secrets live only in CI, never in the repo (see docs/CODE-SIGNING.md).
    # Unsigned releases/rehearsals must be explicitly allowed by signing-policy.
    if: github.server_url == 'https://github.com' && needs.signing-policy.outputs.unsigned != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [desktop, signing-policy]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BYDLO-win-x64
          path: dist/BYDLO-win-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BYDLO-win-arm64
          path: dist/BYDLO-win-arm64
      - name: Sign with Azure Trusted Signing (OIDC, timestamped)
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: BYDLO.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign helpers with Azure Trusted Signing (OIDC, timestamped)
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: Bydlo.Helper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures (signtool)
        shell: pwsh
        run: |
          $files = @(
            'dist/BYDLO-win-x64/BYDLO.exe',
            'dist/BYDLO-win-x64/helper/Bydlo.Helper.exe',
            'dist/BYDLO-win-arm64/BYDLO.exe',
            'dist/BYDLO-win-arm64/helper/Bydlo.Helper.exe'
          )
          foreach ($f in $files) {
            if (!(Test-Path $f)) { throw "Missing signed file: $f" }
            & signtool verify /pa /v $f
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $f" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BYDLO-win-x64
          retention-days: 7
          path: dist/BYDLO-win-x64
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BYDLO-win-arm64
          retention-days: 7
          path: dist/BYDLO-win-arm64
          overwrite: true

  macos:
    name: Verify and bundle macOS Apple Silicon
    if: github.server_url == 'https://github.com' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run isolated tests
        run: |
          source scripts/env.sh
          test "$(uname -m)" = arm64
          dotnet test tests/Bydlo.Tests/Bydlo.Tests.csproj -c Release
      - name: Verify macOS UI (headless, mock only)
        run: |
          source scripts/env.sh
          dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/macos-wizard ru --mock --verify-wizard
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: managed-osx-arm64
          path: publish/BYDLO-osx-arm64
      - name: Identify macOS SDK and toolchain
        id: toolchain
        run: |
          fingerprint=$( (xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; clang --version) | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache-key=openvpn-osx-arm64-v3-$fingerprint-${{ hashFiles('engines/*.lock.json', 'scripts/build-openvpn.sh', 'scripts/build-bundled-engines.ps1', 'scripts/native-build-cache.ps1', 'scripts/openvpn-cache.ps1') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/macos-openvpn-cache
          key: ${{ steps.toolchain.outputs.cache-key }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build native engines
        shell: pwsh
        env:
          BYDLO_OPENVPN_BUILD_CACHE: .tmp/macos-openvpn-cache
          BYDLO_OPENVPN_CACHE_ID: ${{ steps.toolchain.outputs.cache-key }}
        run: ./scripts/build-bundled-engines.ps1 -Rid osx-arm64 -PublishDirectory publish/BYDLO-osx-arm64
      - name: Verify offline bundle
        shell: pwsh
        run: ./scripts/verify-engine-bundle.ps1 -Rid osx-arm64 -PublishDirectory publish/BYDLO-osx-arm64
      - name: Add notices
        run: cp LICENSE THIRD_PARTY_NOTICES.md README.md publish/BYDLO-osx-arm64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BYDLO-osx-arm64
          retention-days: 7
          path: publish/BYDLO-osx-arm64

  native-package-smoke:
    name: Inspect native package fixture ${{ matrix.rid }}
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish application without engines
        run: |
          source scripts/env.sh
          dotnet publish src/Bydlo.Desktop/Bydlo.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/native-smoke
      - name: Inspect package with synthetic engine headers (never execute payload)
        if: ${{ !startsWith(matrix.rid, 'linux-') }}
        shell: pwsh
        run: ./scripts/test-native-package.ps1 -Rid '${{ matrix.rid }}' -ApplicationPublishDirectory artifacts/native-smoke
      - name: Install read-only SquashFS inspector
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends squashfs-tools
      - name: Inspect Linux package with synthetic engine headers (never execute payload)
        if: startsWith(matrix.rid, 'linux-')
        shell: pwsh
        run: ./scripts/test-native-package.ps1 -Rid '${{ matrix.rid }}' -ApplicationPublishDirectory artifacts/native-smoke

  native-packages:
    name: Native package ${{ matrix.rid }}
    if: >-
      !cancelled() && github.server_url == 'https://github.com'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && needs.desktop.result == 'success' && needs.macos.result == 'success'
      && (needs.sign-windows.result == 'success'
          || (needs.signing-policy.outputs.unsigned == 'true' && needs.sign-windows.result == 'skipped'))
    needs: [desktop, macos, sign-windows, signing-policy]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-15 }
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      MAC_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BYDLO-${{ matrix.rid }}
          path: native-payload
      - name: Authenticate Azure signing (OIDC)
        if: startsWith(matrix.rid, 'win-') && needs.signing-policy.outputs.unsigned != 'true' && env.AZURE_CLIENT_ID != ''
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare Windows signing metadata
        if: startsWith(matrix.rid, 'win-') && needs.signing-policy.outputs.unsigned != 'true' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          $metadata = @{ Endpoint = $env:SIGN_ENDPOINT; CodeSigningAccountName = $env:SIGN_ACCOUNT; CertificateProfileName = $env:SIGN_PROFILE }
          $file = Join-Path $PWD '.tmp/azure-signing.json'
          $metadata | ConvertTo-Json | Set-Content $file
          "BYDLO_AZURE_SIGN_METADATA=$file" >> $env:GITHUB_ENV
      - name: Prepare Apple signing and notarization
        if: matrix.rid == 'osx-arm64' && needs.signing-policy.outputs.unsigned != 'true' && env.MAC_CERTIFICATE != ''
        shell: bash
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p .tmp
          keychain="$PWD/.tmp/native-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > .tmp/apple-signing-cert
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import .tmp/apple-signing-cert -P "$CERT_PASSWORD" -A -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials bydlo-notary --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "BYDLO_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "BYDLO_MAC_NOTARY_PROFILE=bydlo-notary" >> "$GITHUB_ENV"
      - name: Restore executable permissions
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          find native-payload -type f \( -name BYDLO -o -name Bydlo.Helper -o -name nfqws -o -name tpws -o -name sing-box -o -name xray -o -name bydlo-amneziawg -o -name openvpn \) -exec chmod 755 {} +
      - name: Install read-only SquashFS inspector
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends squashfs-tools
      - name: Build and inspect native packages (never execute engines)
        shell: pwsh
        env:
          BYDLO_MAC_APP_IDENTITY: ${{ needs.signing-policy.outputs.unsigned != 'true' && secrets.MACOS_APP_IDENTITY || '' }}
          BYDLO_MAC_INSTALLER_IDENTITY: ${{ needs.signing-policy.outputs.unsigned != 'true' && secrets.MACOS_INSTALLER_IDENTITY || '' }}
        run: ./scripts/package-native.ps1 -Rid '${{ matrix.rid }}' -PublishDirectory native-payload -OutputDirectory native-output -RequireSigning:$${{ needs.signing-policy.outputs.unsigned != 'true' }}
      - name: Remove temporary Apple keychain
        if: always() && matrix.rid == 'osx-arm64' && needs.signing-policy.outputs.unsigned != 'true' && env.MAC_CERTIFICATE != ''
        run: security delete-keychain "$PWD/.tmp/native-signing.keychain-db"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          retention-days: 7
          path: |
            native-output/*.exe
            native-output/*.zip
            native-output/*.pkg
            native-output/*.AppImage
            native-output/*.nupkg
            native-output/releases.*.json
          if-no-files-found: error

  package:
    name: Verify release archives
    # Manual runs rehearse release packaging without creating a tag or draft release.
    if: >-
      !cancelled()
      && github.server_url == 'https://github.com'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && needs.desktop.result == 'success'
      && needs.windows-parity.result == 'success'
      && needs.macos.result == 'success'
      && needs.native-packages.result == 'success'
      && needs.native-package-smoke.result == 'success'
      && needs.unix-activation.result == 'success'
      && needs.amnezia-macos.result == 'success'
      && needs.nix.result == 'success'
      && needs.signing-policy.result == 'success'
      && (needs.sign-windows.result == 'success'
          || (needs.signing-policy.outputs.unsigned == 'true' && needs.sign-windows.result == 'skipped'))
    needs: [desktop, windows-parity, sign-windows, macos, native-packages, native-package-smoke, unix-activation, amnezia-macos, nix, signing-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches app version
        # Manual runs rehearse packaging from a branch; only real tags must match Directory.Build.props.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid release tag '${GITHUB_REF_NAME}': expected vX.Y.Z" >&2; exit 1; }
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Release tag '${GITHUB_REF_NAME}' does not match app version 'v${version}' from Directory.Build.props" >&2; exit 1; }
          echo "Release ${GITHUB_REF_NAME} matches app version."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: BYDLO-*
      - name: Verify downloaded bundles before packaging (never execute engines)
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-arm64')) {
            ./scripts/verify-engine-bundle.ps1 -Rid $rid -PublishDirectory "dist/BYDLO-$rid"
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/native
          pattern: native-*
          merge-multiple: false
      - name: Build .deb from verified Linux bundles (never execute payloads)
        run: |
          for rid in linux-x64 linux-arm64; do
            bash scripts/package-linux.sh "$rid" "dist/BYDLO-$rid" dist/linux deb
          done
      - name: Stage the approved flat release set and checksum final bytes
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          ./scripts/stage-release.ps1 -InputDirectory dist -OutputDirectory release-staging -Version $version
      - name: Verify checksums as a flat downloaded release
        run: cd release-staging && sha256sum -c SHA256SUMS.txt
      - name: Sign the update catalog from the final packages
        shell: pwsh
        env:
          # Issue #411: the key lives only in repository secrets. A missing secret fails the job
          # instead of publishing a feed that clients cannot authenticate.
          BYDLO_UPDATE_SIGNING_KEY: ${{ secrets.BYDLO_UPDATE_SIGNING_KEY }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          if (-not $env:BYDLO_UPDATE_SIGNING_KEY -and '${{ github.event_name }}' -eq 'workflow_dispatch') {
            # A manual rehearsal publishes nothing: sign with a throwaway key no client trusts. Tags still require the secret.
            $key = [Security.Cryptography.ECDsa]::Create([Security.Cryptography.ECCurve]::CreateFromFriendlyName('nistP256'))
            try { $env:BYDLO_UPDATE_SIGNING_KEY = $key.ExportPkcs8PrivateKeyPem() } finally { $key.Dispose() }
            Write-Host '::warning::BYDLO_UPDATE_SIGNING_KEY is not set; rehearsal catalog signed with a throwaway key.'
          }
          ./scripts/sign-update-catalog.ps1 -ReleaseDirectory release-staging -Version $version
      - name: Verify the published set including the signed catalog
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          ./scripts/stage-release.ps1 -InputDirectory release-staging -OutputDirectory release-staging -Version $version -VerifyOnly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: release-staging/*
          retention-days: 14
          if-no-files-found: error
  release:
    name: Draft release
    # Releases are published on GitHub only; the Gitea mirror just builds.
    # Explicit status check (issue #336): the default success() propagates a
    # transitive skip (e.g. an allowed unsigned Windows exception), so a
    # successful package would still skip the draft. Check the direct need instead.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && github.server_url == 'https://github.com'
      && needs.package.result == 'success'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Verify downloaded release set before attestation and upload
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          ./scripts/stage-release.ps1 -InputDirectory dist -OutputDirectory dist -Version $version -VerifyOnly
      - name: Extract release notes for this tag
        run: bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" docs/RELEASE_NOTES.md .tmp/release-notes.md
      - name: Link the nine user packages in release notes
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $base = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $version = $env:RELEASE_TAG.Substring(1)
          $notes = @('', '## Скачать', '')
          foreach ($arch in @('x64', 'arm64')) {
            $notes += "- Windows ${arch}: [Setup.exe]($base/BydloDesktop-win-$arch-Setup.exe), [Portable.zip]($base/BydloDesktop-win-$arch-Portable.zip)."
            $debArch = if ($arch -eq 'x64') { 'amd64' } else { 'arm64' }
            $notes += "- Linux ${arch}: [AppImage]($base/BydloDesktop-linux-$arch.AppImage), [.deb]($base/bydlo_${version}_${debArch}.deb)."
          }
          $notes += '- macOS Apple Silicon: [Setup.pkg](' + $base + '/BydloDesktop-osx-arm64-Setup.pkg).'
          $notes += @('', '`*-full.nupkg` и `releases.<RID>.json` — служебные файлы полного обновления; скачивать вручную не нужно.',
            '`releases-catalog.json` — подписанный каталог обновлений; приложение проверяет его подпись до загрузки пакета.',
            ('Для проверки скачайте [SHA256SUMS.txt](' + $base + '/SHA256SUMS.txt); проверяйте суммы в одной папке с пакетами.'))
          Add-Content .tmp/release-notes.md ($notes -join "`n")
      - name: Attest every final release asset including checksums
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --draft --generate-notes --notes-file .tmp/release-notes.md --repo "${GITHUB_REPOSITORY}"
