name: CI

on:
  push:
    # Feature branches are checked by pull_request; avoid a second full matrix on every push.
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # CI never starts real network engines.
  BYDLO_SAFE_DEV: "1"

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is temporarily off: the Gitea runners have no macOS (#57).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Hook self-test
        shell: bash
        run: bash scripts/test-hooks.sh
      - name: Build
        run: dotnet build BYDLO.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test tests/Bydlo.Tests/Bydlo.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Verify import flows (headless, no engines or network)
        run: dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/import-verification en --verify-import
      - name: Verify Zapret selection UI (headless, no engines or network)
        run: dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/selection-verification en --verify-zapret-selection
      - name: Verify desktop integration (headless, mock only, no OS registration)
        run: dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/desktop-verification en --verify-desktop
      - name: Verify bundled engine UI (headless, mock only, no driver setup)
        run: dotnet run --project tools/Bydlo.Screenshots -c Release -- .tmp/bundle-verification en --mock --verify-bundled-engines
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  desktop:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          # osx-x64 / osx-arm64 return with macOS runners (#57).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Bydlo.Desktop/Bydlo.Desktop.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/BYDLO-${{ matrix.rid }}
      - name: Bundle pinned sing-box, Xray and Zapret (never execute engines)
        shell: bash
        run: >
          dotnet run --project tools/Bydlo.BundleEngines -c Release --
          ${{ matrix.rid }} publish/BYDLO-${{ matrix.rid }} .
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and bundle AmneziaWG and OpenVPN (never execute engines)
        shell: pwsh
        run: ./scripts/build-bundled-engines.ps1 -Rid '${{ matrix.rid }}' -PublishDirectory 'publish/BYDLO-${{ matrix.rid }}'
      - name: Verify offline bundle contents and architecture (never execute engines)
        shell: pwsh
        run: ./scripts/verify-engine-bundle.ps1 -Rid '${{ matrix.rid }}' -PublishDirectory 'publish/BYDLO-${{ matrix.rid }}'
      - name: Add notices
        shell: bash
        run: cp LICENSE THIRD_PARTY_NOTICES.md README.md publish/BYDLO-${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: BYDLO-${{ matrix.rid }}
          path: publish/BYDLO-${{ matrix.rid }}

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: BYDLO-*
      - name: Package and checksum
        run: |
          cd dist
          for d in BYDLO-*; do
            case "$d" in
              *linux-*|*osx-*) find "$d" -type f \( -name BYDLO -o -name nfqws -o -name tpws -o -name sing-box -o -name xray -o -name bydlo-amneziawg -o -name openvpn \) -exec chmod 755 {} + ;;
            esac
            (cd "$d" && zip -qr "../$d.zip" .)
          done
          sha256sum *.zip > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS.txt --draft --generate-notes --repo "${GITHUB_REPOSITORY}"
