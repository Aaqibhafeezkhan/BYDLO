version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/**"
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: "/tools/amneziawg"
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
