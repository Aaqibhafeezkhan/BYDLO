syntax = "proto3";
package xray.app.stats.command;
option csharp_namespace = "Bydlo.Engines.Groups.Rpc";
// Wire-compatible subset of XTLS/Xray-core app/stats/command/command.proto (MPL-2.0).
// Source: https://github.com/XTLS/Xray-core/tree/v26.10.21/app/stats/command
// This file is subject to the Mozilla Public License, v. 2.0: https://mozilla.org/MPL/2.0/
message Stat { string name = 1; int64 value = 2; }
message QueryStatsRequest { string pattern = 1; bool reset = 2; }
message QueryStatsResponse { repeated Stat stat = 1; }
service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}
